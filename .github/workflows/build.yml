name: Build calculator APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          for f in *.zip; do unzip -q "$f"; done
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        working-directory: VesKontrolRF_4
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VesKontrolRF-debug-apk
          path: VesKontrolRF_4/app/build/outputs/apk/debug/app-debug.apk
